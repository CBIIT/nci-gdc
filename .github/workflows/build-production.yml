
name: Build for Production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-base-image:
    name: Build Base Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          repository: cbiit/drupal-docker
          ref: base
          path: ./drupal-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        run: |
          docker build --no-cache -t base ./drupal-docker
          docker save base > base-image.tar

      - name: Upload base image
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: base-image.tar

  build-production-image:
    needs: build-base-image
    name: Build and Push Production Image
    runs-on: ubuntu-latest

    steps:
      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: base-image

      - name: Load base image
        run: docker load < base-image.tar

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::543036708785:role/power-user-cicd-role
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Production image
        env:
          ECR_REGISTRY: 543036708785.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: drupal
          IMAGE_TAG: latest
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building production image: $IMAGE"

          docker build --no-cache -t "$IMAGE" ./docker

          docker push "$IMAGE"

          echo "Production image pushed successfully:"
          echo "$IMAGE"
